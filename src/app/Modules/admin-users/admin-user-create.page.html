<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="openMenu()" aria-label="Menú">
        <ion-icon slot="icon-only" name="menu-outline"></ion-icon>
      </ion-button>
      <ion-button (click)="goHome()" aria-label="Inicio" color="primary">
        <ion-icon slot="icon-only" name="home-outline"></ion-icon>
      </ion-button>
      <ion-button (click)="goBack()" aria-label="Volver">
        <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Nuevo admin</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="page">
  <form [formGroup]="form" (ngSubmit)="submit()" class="form">
    <ion-list lines="full">
      <ion-item>
        <ion-input
          label="Nombre"
          labelPlacement="stacked"
          formControlName="name"
          autocomplete="name"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          label="Correo"
          labelPlacement="stacked"
          type="email"
          formControlName="email"
          autocomplete="email"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="stacked"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          autocomplete="new-password"
        ></ion-input>
        <ion-button
          slot="end"
          fill="clear"
          type="button"
          (click)="showPassword = !showPassword"
        >
          {{ showPassword ? 'Ocultar' : 'Ver' }}
        </ion-button>
      </ion-item>
    </ion-list>

    <div class="actions">
      <ion-button
        expand="block"
        type="submit"
        [disabled]="submitting || form.invalid"
      >
        {{ submitting ? 'Creando…' : 'Crear admin' }}
      </ion-button>
    </div>
  </form>
</ion-content>
