<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/metodos-cc"></ion-back-button>
      <ion-button (click)="goHome()" aria-label="Inicio" color="primary">
        <ion-icon slot="icon-only" name="home-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ pageTitle }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="page">
  <div *ngIf="loading" class="state">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Cargando método…</p>
  </div>

  <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="submit()">
    <ion-list lines="none" class="form-list">
      <ion-item class="outlined">
        <ion-input
          label="Nombre del método"
          labelPlacement="stacked"
          formControlName="name"
          placeholder="Ej. Método de campo"
        ></ion-input>
      </ion-item>

      <ion-item class="outlined">
        <ion-textarea
          label="Descripción"
          labelPlacement="stacked"
          formControlName="description"
          rows="4"
          placeholder="Procedimiento o notas del método"
        ></ion-textarea>
      </ion-item>
    </ion-list>

    <div class="actions">
      <ion-button expand="block" type="submit" [disabled]="saving">
        {{ saving ? 'Guardando…' : isEdit ? 'Guardar cambios' : 'Guardar método' }}
      </ion-button>
      <ion-button expand="block" fill="outline" type="button" (click)="cancel()">
        Cancelar
      </ion-button>
    </div>
  </form>
</ion-content>
