<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="openMenu()" aria-label="Menú">
        <ion-icon slot="icon-only" name="menu-outline"></ion-icon>
      </ion-button>
      <ion-button (click)="goHome()" aria-label="Inicio" color="primary">
        <ion-icon slot="icon-only" name="home-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Métodos para CC</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="goCreate()">
        <ion-icon slot="icon-only" name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="page">
  <div *ngIf="loading" class="state">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Cargando métodos…</p>
  </div>

  <div *ngIf="!loading && error" class="state error">
    <p>{{ error }}</p>
    <ion-button fill="outline" (click)="load()">Reintentar</ion-button>
  </div>

  <ng-container *ngIf="!loading && !error">
    <div class="actions">
      <ion-button expand="block" (click)="goCreate()">Crear método</ion-button>
    </div>

    <ion-list>
      <ion-item
        button
        detail="true"
        *ngFor="let m of metodos"
        (click)="goEdit(m)"
      >
        <ion-label>
          <h2>{{ m.name }}</h2>
          <p *ngIf="m.description">{{ m.description }}</p>
        </ion-label>
      </ion-item>
    </ion-list>

    <div *ngIf="!metodos.length" class="state">
      <p>No hay métodos registrados.</p>
    </div>
  </ng-container>
</ion-content>
